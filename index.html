<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>王滢滢大美女 ✨</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#05030f}
  body{
    font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
    cursor:crosshair;
    -webkit-tap-highlight-color:transparent;
  }
  #scene{position:fixed;inset:0;display:block}

  /* 极光光斑层 */
  .aurora{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1}
  .blob{
    position:absolute;border-radius:50%;filter:blur(80px);opacity:.55;
    mix-blend-mode:screen;will-change:transform;
  }
  .b1{width:46vmax;height:46vmax;left:-12vmax;top:-14vmax;
      background:radial-gradient(circle,#ff2d95 0%,rgba(255,45,149,0) 70%);
      animation:float1 18s ease-in-out infinite}
  .b2{width:42vmax;height:42vmax;right:-10vmax;top:8vmax;
      background:radial-gradient(circle,#00e5ff 0%,rgba(0,229,255,0) 70%);
      animation:float2 22s ease-in-out infinite}
  .b3{width:40vmax;height:40vmax;left:22vmax;bottom:-18vmax;
      background:radial-gradient(circle,#a855f7 0%,rgba(168,85,247,0) 70%);
      animation:float3 26s ease-in-out infinite}
  @keyframes float1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(14vmax,10vmax) scale(1.2)}}
  @keyframes float2{0%,100%{transform:translate(0,0) scale(1.1)}50%{transform:translate(-16vmax,12vmax) scale(.9)}}
  @keyframes float3{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(10vmax,-12vmax) scale(1.25)}}

  /* 暗角 + 扫描线质感 */
  .vignette{position:fixed;inset:0;pointer-events:none;z-index:3;
    background:radial-gradient(ellipse at center,rgba(0,0,0,0) 45%,rgba(0,0,0,.75) 100%)}
  .grain{position:fixed;inset:0;pointer-events:none;z-index:4;opacity:.05;
    background-image:repeating-linear-gradient(0deg,#fff 0 1px,transparent 1px 3px)}

  /* 副标题与提示 */
  .ui{position:fixed;inset:0;pointer-events:none;z-index:5;
      display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
      padding-bottom:clamp(18px,4vh,52px)}
  .sub{
    font-size:clamp(11px,1.5vw,17px);letter-spacing:.42em;text-indent:.42em;
    color:rgba(255,255,255,.72);
    text-shadow:0 0 12px rgba(255,110,200,.9),0 0 30px rgba(120,80,255,.6);
    animation:breathe 3.4s ease-in-out infinite;
    font-weight:300;
  }
  .tip{
    margin-top:10px;font-size:clamp(9px,1.05vw,12px);letter-spacing:.2em;
    color:rgba(255,255,255,.34);font-weight:300;
  }
  @keyframes breathe{0%,100%{opacity:.55;transform:translateY(0)}50%{opacity:1;transform:translateY(-4px)}}

  /* 顶部装饰线 */
  .bar{position:fixed;top:0;left:0;width:100%;height:2px;z-index:6;
    background:linear-gradient(90deg,transparent,#ff2d95,#00e5ff,#a855f7,transparent);
    background-size:200% 100%;animation:sweep 5s linear infinite;opacity:.85}
  @keyframes sweep{0%{background-position:0% 0}100%{background-position:200% 0}}
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div class="aurora">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
</div>
<div class="vignette"></div>
<div class="grain"></div>
<div class="bar"></div>

<div class="ui">
  <div class="sub">最 美 的 人 · 最 亮 的 星</div>
  <div class="tip">移动鼠标 / 手指可以拨动粒子 · 点击会有惊喜</div>
</div>

<script>
(() => {
  'use strict';

  const TEXT = '王滢滢大美女';
  const cvs = document.getElementById('scene');
  const ctx = cvs.getContext('2d', { alpha: true });

  let W = 0, H = 0, DPR = 1;
  let particles = [];
  let stars = [];
  let ripples = [];
  let sparks = [];
  let mouse = { x: -9999, y: -9999, px: -9999, py: -9999, active: false };
  let assembleAt = 0;   // 下一次重新聚合的时间戳
  let time = 0;

  const rand = (a, b) => a + Math.random() * (b - a);

  /* ---------- 尺寸 ---------- */
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    cvs.width = Math.floor(W * DPR);
    cvs.height = Math.floor(H * DPR);
    cvs.style.width = W + 'px';
    cvs.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);
    buildParticles();
    buildStars();
  }

  /* ---------- 采样文字像素点 ---------- */
  function sampleTextPoints() {
    const off = document.createElement('canvas');
    off.width = W;
    off.height = H;
    const o = off.getContext('2d');
    o.fillStyle = '#fff';
    o.textAlign = 'center';
    o.textBaseline = 'middle';

    // 自适应字号：横向 6 个字留出安全边距
    const fs = Math.min(W / (TEXT.length * 1.06), H / 3.4);
    o.font = `900 ${fs}px "Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif`;
    o.fillText(TEXT, W / 2, H / 2);

    const gap = Math.max(2, Math.round(fs / 46));
    const data = o.getImageData(0, 0, W, H).data;
    const pts = [];
    for (let y = 0; y < H; y += gap) {
      for (let x = 0; x < W; x += gap) {
        if (data[(y * W + x) * 4 + 3] > 128) pts.push({ x, y });
      }
    }
    return pts;
  }

  /* ---------- 粒子 ---------- */
  function buildParticles() {
    const pts = sampleTextPoints();
    const cx = W / 2, cy = H / 2;
    const next = [];

    for (let i = 0; i < pts.length; i++) {
      const p = pts[i];
      const a = Math.random() * Math.PI * 2;
      const r = Math.max(W, H) * rand(0.55, 1.15);
      const old = particles[i];

      // 颜色随横向位置走「品红 → 紫 → 青」渐变，亮度带随机
      const t = p.x / W;
      const hue = 315 - 130 * t + rand(-14, 14);
      const light = 58 + rand(-8, 14);

      const np = {
        tx: p.x,
        ty: p.y,
        x: old ? old.x : cx + Math.cos(a) * r,
        y: old ? old.y : cy + Math.sin(a) * r,
        vx: old ? old.vx : 0,
        vy: old ? old.vy : 0,
        size: rand(0.9, 1.9),
        color: `hsl(${hue},100%,${light}%)`,
        phase: Math.random() * Math.PI * 2,
        spd: rand(0.018, 0.045),
        amp: rand(0.5, 1.7),
        ease: rand(0.055, 0.11)
      };
      next.push(np);
    }
    particles = next.slice(0, 9000);
  }

  /* ---------- 背景星尘 ---------- */
  function buildStars() {
    const n = Math.min(260, Math.round((W * H) / 9000));
    stars = [];
    for (let i = 0; i < n; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: rand(0.4, 1.5),
        a: rand(0.15, 0.75),
        tw: rand(0.4, 2.2),
        ph: Math.random() * Math.PI * 2,
        vx: rand(-0.06, 0.06),
        vy: rand(-0.1, -0.02)
      });
    }
  }

  /* ---------- 交互 ---------- */
  function setPointer(x, y) {
    mouse.px = mouse.x;
    mouse.py = mouse.y;
    mouse.x = x;
    mouse.y = y;
    mouse.active = true;
  }

  window.addEventListener('mousemove', e => setPointer(e.clientX, e.clientY));
  window.addEventListener('mouseleave', () => { mouse.active = false; mouse.x = mouse.y = -9999; });
  window.addEventListener('touchmove', e => {
    const t = e.touches[0];
    if (t) setPointer(t.clientX, t.clientY);
  }, { passive: true });

  function boom(x, y) {
    ripples.push({ x, y, r: 6, max: Math.max(W, H) * 0.55, life: 1 });
    ripples.push({ x, y, r: 2, max: Math.max(W, H) * 0.3, life: 1, delay: 8 });

    const hue = rand(0, 360);
    for (let i = 0; i < 90; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = rand(2, 11);
      sparks.push({
        x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        life: 1,
        decay: rand(0.012, 0.032),
        size: rand(1, 3.2),
        color: `hsl(${(hue + rand(-70, 70) + 360) % 360},100%,${rand(58, 80)}%)`
      });
    }
    // 点击处把附近粒子向外推
    for (const p of particles) {
      const dx = p.x - x, dy = p.y - y;
      const d2 = dx * dx + dy * dy;
      if (d2 < 42000) {
        const d = Math.sqrt(d2) || 1;
        const f = (1 - d / 205) * 26;
        p.vx += (dx / d) * f;
        p.vy += (dy / d) * f;
      }
    }
  }

  window.addEventListener('mousedown', e => boom(e.clientX, e.clientY));
  window.addEventListener('touchstart', e => {
    const t = e.touches[0];
    if (t) { setPointer(t.clientX, t.clientY); boom(t.clientX, t.clientY); }
  }, { passive: true });

  /* ---------- 主循环 ---------- */
  function frame(now) {
    time += 1;

    // 拖尾式清屏，形成流光残影
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgba(5,3,15,0.30)';
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';

    drawStars(now);
    if (mouse.active && mouse.px > -9999) drawTrail();

    // 每隔一段时间让粒子散开再重新聚合一次
    if (now > assembleAt) {
      assembleAt = now + 9000;
      scatter(0.9);
      setTimeout(() => scatter(0.35), 900);
    }

    drawParticles();
    drawRipples();
    drawSparks();

    requestAnimationFrame(frame);
  }

  function scatter(power) {
    for (const p of particles) {
      const a = Math.random() * Math.PI * 2;
      const sp = rand(5, 24) * power;
      p.vx += Math.cos(a) * sp;
      p.vy += Math.sin(a) * sp;
    }
  }

  function drawStars(now) {
    for (const s of stars) {
      s.x += s.vx;
      s.y += s.vy;
      if (s.y < -4) { s.y = H + 4; s.x = Math.random() * W; }
      if (s.x < -4) s.x = W + 4;
      if (s.x > W + 4) s.x = -4;

      const tw = 0.55 + 0.45 * Math.sin(now * 0.001 * s.tw + s.ph);
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, 6.2832);
      ctx.fillStyle = `rgba(200,225,255,${s.a * tw})`;
      ctx.fill();
    }
  }

  function drawTrail() {
    const dx = mouse.x - mouse.px, dy = mouse.y - mouse.py;
    const sp = Math.hypot(dx, dy);
    const n = Math.min(14, Math.max(2, Math.round(sp / 3)));
    for (let i = 0; i < n; i++) {
      const t = i / n;
      const x = mouse.px + dx * t + rand(-4, 4);
      const y = mouse.py + dy * t + rand(-4, 4);
      const hue = (time * 3 + i * 12) % 360;
      ctx.beginPath();
      ctx.arc(x, y, rand(0.8, 2.6) * (0.4 + t * 0.6), 0, 6.2832);
      ctx.fillStyle = `hsla(${hue},100%,72%,${0.30 * (0.3 + t * 0.7)})`;
      ctx.fill();
    }
  }

  function drawParticles() {
    const mr = 130, mr2 = mr * mr;

    for (const p of particles) {
      // 目标点自身做极轻的呼吸抖动，让它「活」起来
      const wob = Math.sin(time * p.spd + p.phase) * p.amp;
      const tx = p.tx + wob;
      const ty = p.ty + Math.cos(time * p.spd * 0.9 + p.phase) * p.amp;

      // 弹簧回位
      p.vx += (tx - p.x) * p.ease;
      p.vy += (ty - p.y) * p.ease;

      // 鼠标排斥
      if (mouse.active) {
        const dx = p.x - mouse.x, dy = p.y - mouse.y;
        const d2 = dx * dx + dy * dy;
        if (d2 < mr2 && d2 > 0.01) {
          const d = Math.sqrt(d2);
          const f = (1 - d / mr) * 3.4;
          p.vx += (dx / d) * f;
          p.vy += (dy / d) * f;
        }
      }

      p.vx *= 0.90;
      p.vy *= 0.90;
      p.x += p.vx;
      p.y += p.vy;

      const speed = Math.abs(p.vx) + Math.abs(p.vy);
      const glow = Math.min(1, 0.5 + speed * 0.12);

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * (1 + glow * 0.5), 0, 6.2832);
      ctx.fillStyle = p.color;
      ctx.globalAlpha = 0.55 + glow * 0.45;
      ctx.fill();

      // 高速运动时拖出短光条
      if (speed > 3.2) {
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x - p.vx * 2.6, p.y - p.vy * 2.6);
        ctx.strokeStyle = p.color;
        ctx.lineWidth = p.size * 0.7;
        ctx.globalAlpha = 0.32;
        ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
  }

  function drawRipples() {
    for (let i = ripples.length - 1; i >= 0; i--) {
      const r = ripples[i];
      if (r.delay > 0) { r.delay--; continue; }
      r.r += (r.max - r.r) * 0.055 + 1.6;
      r.life *= 0.965;

      ctx.beginPath();
      ctx.arc(r.x, r.y, r.r, 0, 6.2832);
      ctx.strokeStyle = `hsla(${(time * 2 + r.r) % 360},100%,72%,${r.life * 0.55})`;
      ctx.lineWidth = 2.4;
      ctx.stroke();

      if (r.life < 0.03) ripples.splice(i, 1);
    }
  }

  function drawSparks() {
    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i];
      s.x += s.vx;
      s.y += s.vy;
      s.vy += 0.12;      // 重力
      s.vx *= 0.985;
      s.vy *= 0.985;
      s.life -= s.decay;

      if (s.life <= 0) { sparks.splice(i, 1); continue; }

      ctx.beginPath();
      ctx.arc(s.x, s.y, s.size * s.life, 0, 6.2832);
      ctx.fillStyle = s.color;
      ctx.globalAlpha = s.life;
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  /* ---------- 启动 ---------- */
  let rt;
  window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(resize, 180); });

  resize();
  assembleAt = performance.now() + 9000;
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
